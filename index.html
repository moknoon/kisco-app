<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설관리 실무 앱 v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f0f0;
  --surface: #ffffff;
  --surface2: #f5f5f5;
  --surface3: #ebebeb;
  --border: #d4d4d4;
  --border2: #b8b8b8;
  --primary: #1a1a1a;
  --primary-dim: #e8e8e8;
  --success: #1f7a3a;
  --success-dim: #d4edda;
  --warn: #92500a;
  --warn-dim: #fdefd4;
  --danger: #991b1b;
  --danger-dim: #fde8e8;
  --purple: #4c1d95;
  --purple-dim: #ede9fe;
  --text: #111111;
  --text2: #444444;
  --text3: #888888;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:var(--sans); background:var(--bg); color:var(--text); font-size:14px; }

/* ─── LAYOUT ─── */
#app { display:flex; height:100vh; overflow:hidden; }
#sidebar {
  width:220px; min-width:220px; background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  transition:width .3s;
}
#main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#topbar {
  height:56px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 24px; gap:16px; flex-shrink:0;
}
#content { flex:1; overflow-y:auto; padding:24px; }

/* ─── SIDEBAR ─── */
.logo {
  padding:20px 16px 16px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border);
}
.logo-icon {
  width:36px; height:36px; background:#111111; border-radius:8px;
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.logo-text { font-size:13px; font-weight:700; color:var(--text); line-height:1.3; }
.logo-sub { font-size:10px; color:var(--text3); font-weight:400; }

.nav { flex:1; padding:12px 8px; display:flex; flex-direction:column; gap:2px; }
.nav-item {
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border-radius:var(--radius-sm); cursor:pointer; transition:all .15s;
  color:var(--text2); font-size:13px; font-weight:500; user-select:none;
}
.nav-item:hover { background:var(--surface2); color:var(--text); }
.nav-item.active { background:#e8e8e8; color:#111111; border-left:3px solid #111111; }
.nav-item .icon { font-size:16px; width:20px; text-align:center; }
.nav-badge {
  margin-left:auto; background:var(--danger); color:#fff;
  font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px;
  font-family:var(--mono);
}

.sidebar-footer { padding:12px 16px; border-top:1px solid var(--border); }
.version-tag { font-size:10px; color:var(--text3); font-family:var(--mono); }

/* ─── TOPBAR ─── */
.page-title { font-size:16px; font-weight:700; color:var(--text); flex:1; }
.topbar-actions { display:flex; gap:8px; align-items:center; }
.btn {
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px;
  border-radius:var(--radius-sm); font-size:13px; font-weight:600;
  cursor:pointer; border:none; font-family:var(--sans); transition:all .15s;
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#333333; }
.btn-ghost { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--surface3); color:var(--text); }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn-danger { background:var(--danger-dim); color:var(--danger); border:1px solid var(--danger); }
.btn-success { background:var(--success-dim); color:var(--success); }

/* ─── CARDS / GRID ─── */
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
}
.card-sm { padding:16px; }
.grid { display:grid; gap:16px; }
.grid-4 { grid-template-columns:repeat(4,1fr); }
.grid-3 { grid-template-columns:repeat(3,1fr); }
.grid-2 { grid-template-columns:repeat(2,1fr); }

/* ─── STAT CARDS ─── */
.stat-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px 20px;
  display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;
}
.stat-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
}
.stat-card.blue::before { background:var(--primary); }
.stat-card.green::before { background:var(--success); }
.stat-card.warn::before { background:var(--warn); }
.stat-card.danger::before { background:var(--danger); }
.stat-card.purple::before { background:var(--purple); }
.stat-label { font-size:11px; color:var(--text3); font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
.stat-value { font-size:32px; font-weight:700; font-family:var(--mono); color:var(--text); }
.stat-sub { font-size:11px; color:var(--text2); }

/* ─── TABLE ─── */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th {
  background:var(--surface2); color:var(--text3); font-size:11px;
  font-weight:600; letter-spacing:.5px; text-transform:uppercase;
  padding:10px 14px; text-align:left; border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td {
  padding:11px 14px; border-bottom:1px solid var(--border);
  font-size:13px; color:var(--text2); vertical-align:middle;
}
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--surface2); color:var(--text); }
td.bold { color:var(--text); font-weight:600; }

/* ─── BADGES ─── */
.badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:4px; font-size:11px; font-weight:600;
  white-space:nowrap; font-family:var(--mono);
}
.badge-blue { background:var(--primary-dim); color:var(--primary); }
.badge-green { background:var(--success-dim); color:var(--success); }
.badge-warn { background:var(--warn-dim); color:var(--warn); }
.badge-danger { background:var(--danger-dim); color:var(--danger); }
.badge-purple { background:var(--purple-dim); color:var(--purple); }
.badge-gray { background:var(--surface3); color:var(--text2); }

/* ─── FORM ─── */
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-label { font-size:12px; font-weight:600; color:var(--text2); }
.form-input, .form-select, .form-textarea {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:9px 12px; color:var(--text);
  font-size:13px; font-family:var(--sans); outline:none; transition:border .15s;
  width:100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color:var(--primary);
}
.form-select option { background:var(--surface2); }
.form-textarea { resize:vertical; min-height:80px; }
.form-grid { display:grid; gap:14px; }
.form-grid-2 { grid-template-columns:1fr 1fr; }
.form-grid-3 { grid-template-columns:1fr 1fr 1fr; }
.form-checkbox { display:flex; align-items:center; gap:8px; cursor:pointer; }
.form-checkbox input { width:16px; height:16px; accent-color:var(--primary); cursor:pointer; }

/* ─── MODAL ─── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7);
  display:flex; align-items:center; justify-content:center;
  z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;
}
.modal-overlay.show { opacity:1; pointer-events:all; }
.modal {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--radius); width:min(680px,95vw); max-height:90vh;
  overflow-y:auto; transform:translateY(-10px); transition:transform .2s;
}
.modal-overlay.show .modal { transform:translateY(0); }
.modal-header {
  padding:20px 24px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-title { font-size:16px; font-weight:700; }
.modal-close {
  background:none; border:none; color:var(--text3); font-size:20px;
  cursor:pointer; line-height:1; padding:4px;
}
.modal-close:hover { color:var(--text); }
.modal-body { padding:24px; display:flex; flex-direction:column; gap:16px; }
.modal-footer {
  padding:16px 24px; border-top:1px solid var(--border);
  display:flex; justify-content:flex-end; gap:8px;
}

/* ─── MISC ─── */
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.section-title { font-size:15px; font-weight:700; color:var(--text); }
.section-sub { font-size:12px; color:var(--text3); margin-top:2px; }
.divider { height:1px; background:var(--border); margin:16px 0; }
.empty { text-align:center; padding:40px 20px; color:var(--text3); font-size:13px; }
.tag { display:inline-flex; align-items:center; gap:3px; padding:2px 7px; background:var(--surface3); border-radius:4px; font-size:11px; color:var(--text2); }
.tag-new { background:var(--primary-dim); color:var(--primary); }
.search-bar {
  display:flex; align-items:center; gap:8px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:8px 12px; flex:1; max-width:320px;
}
.search-bar input { background:none; border:none; color:var(--text); font-size:13px; outline:none; flex:1; font-family:var(--sans); }
.filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.dday-ok { color:var(--success); font-family:var(--mono); font-weight:600; font-size:12px; }
.dday-warn { color:var(--warn); font-family:var(--mono); font-weight:600; font-size:12px; }
.dday-danger { color:var(--danger); font-family:var(--mono); font-weight:700; font-size:12px; }
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }
.dot-green { background:var(--success); }
.dot-warn { background:var(--warn); }
.dot-danger { background:var(--danger); }
.dot-gray { background:var(--text3); }
.renewal-tag { background:#e8f5e9; color:#1b5e20; border:1px solid #a5d6a7; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:700; }

/* scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* ─── BOTTOM TAB BAR (mobile only) ─── */
#bottom-nav {
  display:none;
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  background:var(--surface); border-top:2px solid var(--border2);
}
.bnav-inner { display:flex; height:62px; padding-bottom:env(safe-area-inset-bottom,0); }
.bnav-item {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; cursor:pointer; position:relative;
  color:var(--text3); transition:color .15s; padding:6px 2px;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.bnav-item.active { color:#111111; }
.bnav-item.active::after {
  content:''; position:absolute; top:0; left:20%; right:20%;
  height:2px; background:#111111; border-radius:0 0 3px 3px;
}
.bnav-item .bicon { font-size:20px; line-height:1.2; }
.bnav-item .blabel { font-size:9px; font-weight:600; white-space:nowrap; }
.bnav-item .bbadge {
  position:absolute; top:5px; right:calc(50% - 20px);
  background:var(--danger); color:#fff; font-size:9px; font-weight:700;
  padding:1px 4px; border-radius:8px;
}

@media(max-width:768px) {
  #sidebar { display:none !important; }
  #bottom-nav { display:block; }
  #content { padding:14px 12px 78px; }
  #topbar { padding:0 14px; height:50px; }
  .page-title { font-size:14px; }
  .btn { font-size:13px; padding:8px 11px; }
  .btn-sm { font-size:12px; padding:7px 9px; }
  .grid-4 { grid-template-columns:repeat(2,1fr); }
  .grid-3, .grid-2 { grid-template-columns:1fr; }
  .form-grid-2, .form-grid-3 { grid-template-columns:1fr; }
  .form-input, .form-select, .form-textarea { font-size:16px; padding:11px 12px; }
  td { font-size:12px; padding:9px 10px; }
  th { font-size:10px; padding:8px 10px; }
  .stat-value { font-size:26px; }
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .modal { width:100vw; max-height:93vh; border-radius:16px 16px 0 0; align-self:flex-end; display:flex; flex-direction:column; overflow:hidden; }
  .modal-overlay { align-items:flex-end; }
  .modal-header { padding:16px 18px; flex-shrink:0; }
  .modal-body { padding:16px 18px; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .modal-footer { padding:16px 18px; flex-shrink:0; background:var(--surface); border-top:1px solid var(--border); }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">
      <div class="logo-icon">🏢</div>
      <div>
        <div class="logo-text">시설관리<br>실무 앱</div>

      </div>
    </div>
    <nav class="nav">

        <span class="nav-badge" id="badge-legal" style="display:none">0</span>

      <div class="nav-item" data-tab="drawing" onclick="switchTab('drawing')">

    <div class="sidebar-footer">

  <main id="main">
    <div id="topbar">
      <div class="page-title" id="page-title">대시보드</div>

  </main>
</div>

<nav id="bottom-nav">
  <div class="bnav-inner">
    <div class="bnav-item active" data-btab="dashboard" onclick="switchTab('dashboard')">
      <span class="bicon">🏠</span><span class="blabel">대시보드</span>
    </div>
    <div class="bnav-item" data-btab="equipment" onclick="switchTab('equipment')">
      <span class="bicon">🔧</span><span class="blabel">장비</span>
    </div>
    <div class="bnav-item" data-btab="history" onclick="switchTab('history')">
      <span class="bicon">📋</span><span class="blabel">이력</span>
    </div>
    <div class="bnav-item" data-btab="consumable" onclick="switchTab('consumable')">
      <span class="bicon">🔔</span><span class="blabel">소모품</span>
      <span class="bbadge" id="bnav-badge-consumable" style="display:none">0</span>
    </div>
    <div class="bnav-item" data-btab="legal" onclick="switchTab('legal')">
      <span class="bicon">⚠️</span><span class="blabel">법정</span>
      <span class="bbadge" id="bnav-badge-legal" style="display:none">0</span>
    </div>
    <div class="bnav-item" data-btab="drawing" onclick="switchTab('drawing')">
      <span class="bicon">📐</span><span class="blabel">도면</span>
    </div>
  </div>
</nav>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnBg(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════
   DATA STORE  (Google Sheets 연동)
════════════════════════════════════ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkA5wNy1Ucf6eUEpKC6_ASMuYpaTqidUeGVHM6dUi4JebIU1OCFa0I6C_y5ldjffk7/exec';

const DB = {
  _cache: {},

  get(k) {
    return this._cache[k] !== undefined ? this._cache[k] : 
           JSON.parse(localStorage.getItem('fm_'+k) || 'null');
  },

  set(k, v) {
    localStorage.setItem('fm_'+k, JSON.stringify(v));
    this._cache[k] = v;

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'setData', key: k, value: v })
    }).catch(err => console.warn('서버 저장 실패 (로컬 저장됨):', err));
  },

  load(k, def) {
    const d = this.get(k);
    return d !== null ? d : def;
  },

  async sync(k) {
    try {
      const res = await fetch(`${SCRIPT_URL}?key=${k}`);
      const data = await res.json();
      if (data !== null) {
        this._cache[k] = data;
        localStorage.setItem('fm_'+k, JSON.stringify(data));
      }
      return data;
    } catch(e) {
      console.warn('동기화 실패, 로컬 데이터 사용:', e);
      return this.get(k);
    }
  }
};
/* ════════════════════════════════════
   2. EQUIPMENT (모달 기능 및 수리 이력 연동 연장선)
════════════════════════════════════ */
function openEqModal(id) {
  const eq = id ? getEq().find(e=>e.id===id) : null;
  document.getElementById('modal-title').textContent = eq ? '장비 수정' : '장비 등록';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-grid form-grid-2">
      <div class="form-group"><label class="form-label">장비명 *</label><input class="form-input" id="eq-name" value="${eq?eq.name:''}"></div>
      <div class="form-group"><label class="form-label">모델명</label><input class="form-input" id="eq-model" value="${eq?eq.model:''}"></div>
    </div>
    <div class="form-grid form-grid-2">
      <div class="form-group"><label class="form-label">제조사</label><input class="form-input" id="eq-maker" value="${eq?eq.maker:''}"></div>
      <div class="form-group"><label class="form-label">위치(구역) *</label><input class="form-input" id="eq-location" value="${eq?eq.location:''}"></div>
    </div>
    <div class="form-grid form-grid-3">
      <div class="form-group">
        <label class="form-label">위험 등급</label>
        <select class="form-select" id="eq-risk">
          <option value="일반" ${eq?.risk==='일반'?'selected':''}>일반</option>
          <option value="고위험" ${eq?.risk==='고위험'?'selected':''}>고위험</option>
          <option value="저위험" ${eq?.risk==='저위험'?'selected':''}>저위험</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">상태</label>
        <select class="form-select" id="eq-status">
          <option value="정상" ${eq?.status==='정상'?'selected':''}>정상</option>
          <option value="점검중" ${eq?.status==='점검중'?'selected':''}>점검중</option>
          <option value="고장" ${eq?.status==='고장'?'selected':''}>고장</option>
          <option value="사용중지" ${eq?.status==='사용중지'?'selected':''}>사용중지</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">설치일</label><input class="form-input" type="date" id="eq-installed" value="${eq?eq.installed:today()}"></div>
    </div>
    <div class="form-group"><label class="form-label">관리대상 물질 (유해화학물질 등)</label><input class="form-input" id="eq-substance" value="${eq?eq.substance:''}"></div>
    <div class="form-group">
      <label class="form-checkbox">
        <input type="checkbox" id="eq-renewal" ${eq? (eq.renewal?'checked':'') : 'checked'}>
        <span class="form-label" style="margin:0;">연구실 리뉴얼 대상 장비 (5층)</span>
      </label>
    </div>
    <div class="form-group">
      <label class="form-label">장비 사진 첨부 (모바일 촬영 지원)</label>

function openDwModal(id) {
  const d = id ? getDrawings().find(x=>x.id===id) : null;
  document.getElementById('modal-title').textContent = d ? '도면 정보 수정' : '도면 등록';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-grid form-grid-2">
      <div class="form-group"><label class="form-label">도면 명칭 *</label><input class="form-input" id="dw-title" placeholder="예: 5층 배기 덕트 계통도" value="${d?d.title:''}"></div>
      <div class="form-group"><label class="form-label">해당 층 *</label><input class="form-input" id="dw-floor" placeholder="예: 5층, 옥상" value="${d?d.floor:'5층'}"></div>
    </div>
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label class="form-label">도면 분류</label>
        <select class="form-select" id="dw-type">
          <option value="공조/덕트" ${d?.type==='공조/덕트'?'selected':''}>공조/덕트</option>
          <option value="소방" ${d?.type==='소방'?'selected':''}>소방</option>
          <option value="전기" ${d?.type==='전기'?'selected':''}>전기</option>
          <option value="건축/평면" ${d?.type==='건축/평면'?'selected':''}>건축/평면</option>
          <option value="기타" ${d?.type==='기타'?'selected':''}>기타</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">세부 구역</label><input class="form-input" id="dw-area" placeholder="예: 연구실 B구역, 전체" value="${d?d.area||'':''}"></div>
    </div>
    <div class="form-group"><label class="form-label">클라우드/NAS 주소 (선택 링크)</label><input class="form-input" type="url" id="dw-link" placeholder="https://..." value="${d?d.linkUrl||'':''}"></div>
    <div class="form-group"><label class="form-label">최종 개정일</label><input class="form-input" type="date" id="dw-updated" value="${d?d.updated:today()}"></div>
    <div class="form-group"><label class="form-label">상세 비고 설명</label><input class="form-input" id="dw-note" value="${d?d.note||'':''}"></div>
    <div class="form-group">
      <label class="form-label">도면 파일 이미지 첨부 (5MB 미만)</label>
      <input type="file" id="dw-file-input" class="form-input">
    </div>
  `;
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">취소</button>
    <button class="btn btn-primary" onclick="saveDw('${id||''}')">저장</button>
  `;
  openModal();
}

function saveDw(id) {
  const title = document.getElementById('dw-title').value.trim();
  const floor = document.getElementById('dw-floor').value.trim();
  if(!title || !floor) { alert('도면 명칭과 해당 층은 필수 영역입니다.'); return; }

  const fileInput = document.getElementById('dw-file-input');
  const file = fileInput.files[0];
  const existing = id ? getDrawings().find(x=>x.id===id) : null;

  function doSave(fileData, fileName) {
    const data = {
      id: id || 'DW'+String(Date.now()).slice(-6),
      title, floor, area: document.getElementById('dw-area').value.trim(),
      type: document.getElementById('dw-type').value,
      linkUrl: document.getElementById('dw-link').value.trim(),
      fileData: fileData, fileName: fileName,
      note: document.getElementById('dw-note').value.trim(),
      updated: document.getElementById('dw-updated').value
    };
    let drawings = getDrawings();
    if(id) drawings = drawings.map(d=>d.id===id?data:d);
    else drawings.push(data);
    try {
      DB.set('drawings', drawings);
    } catch(e) {
      alert('저장 용량 초과입니다. 파일 크기를 줄이거나 링크 방식을 사용해 주세요.');
      return;
    }
    closeModal(); renderDrawing();
  }

  if(file) {
    if(file.size > 5*1024*1024) { alert('파일 크기는 5MB 이하만 가능합니다.'); return; }
    const reader = new FileReader();
    reader.onload = e => doSave(e.target.result, file.name);
    reader.readAsDataURL(file);
  } else {
    doSave(existing?.fileData||null, existing?.fileName||null);
  }
}

/* ════════════════════════════════════
   CORE APP VIEW NAVIGATION CONTROLLER
════════════════════════════════════ */
let currentTab = 'dashboard';

function switchTab(tabId) {
  currentTab = tabId;
  
  // 사이드바 액티브 제어
  document.querySelectorAll('.nav-item').forEach(el => {
    if(el.getAttribute('data-tab') === tabId) el.classList.add('active');
    else el.classList.remove('active');
  });

  // 모바일 하단 탭바 액티브 제어
  document.querySelectorAll('.bnav-item').forEach(el => {
    if(el.getAttribute('data-btab') === tabId) el.classList.add('active');
    else el.classList.remove('active');
  });

  // 상단 타이틀 갱신 및 레이아웃 바인딩 호출
  const titles = { dashboard: '대시보드 종합현황', equipment: '시설 장비 등록대장', history: '점검/수리 통합 실무이력', consumable: '소모품 교체 주기 관리', legal: '법정의무점검 진단관리', drawing: '시설 도면 자료실' };
  document.getElementById('page-title').textContent = titles[tabId] || '종합 정보';

  if (tabId === 'dashboard') renderDashboard();
  else if (tabId === 'equipment') renderEquipment();
  else if (tabId === 'history') renderHistory();
  else if (tabId === 'consumable') renderConsumable();
  else if (tabId === 'legal') renderLegal();
  else if (tabId === 'drawing') renderDrawing();

  // 뱃지 상태 실시간 카운트 리액션 반영
  updateBadges();
}

/* ════════════════════════════════════
   모바일 호환 및 드래그 버그가 완전 해결된 통합 제어 영역
════════════════════════════════════ */

// 1. 마우스 드래그 오동작 방지를 위한 전역 변수
let modalMouseDownTarget = null;

function openModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('show');
  
  // 마우스/터치 다운 시점의 타겟 저장 (드래그 시 창 닫힘 완전 차단)
  overlay.onmousedown = function(e) {
    modalMouseDownTarget = e.target;
  };

  // [모바일 호환성 강화] display: none 대신 투명도 및 포인터 제어로 파일 선택창 충돌 방지
  const bnav = document.getElementById('bottom-nav');
  if(bnav) {
    bnav.style.opacity = '0';
    bnav.style.pointerEvents = 'none';
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  modalMouseDownTarget = null; // 초기화
  
  const bnav = document.getElementById('bottom-nav');
  if(bnav) {
    bnav.style.opacity = '1';
    bnav.style.pointerEvents = 'all';
  }
}

// 2. 배경 클릭 시 창 닫기 함수 (정밀 타겟 판정)
function closeModalOnBg(e) {
  const overlay = document.getElementById('modal-overlay');
  // mousedown 타겟과 mouseup 타겟이 모두 overlay 배경일 때만 안전하게 닫기 수행
  if (e.target === overlay && modalMouseDownTarget === overlay) {
    closeModal();
  }
}
</script>
