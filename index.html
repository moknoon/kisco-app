<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설관리 실무 앱 v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f0f0;
  --surface: #ffffff;
  --surface2: #f5f5f5;
  --surface3: #ebebeb;
  --border: #d4d4d4;
  --border2: #b8b8b8;
  --primary: #1a1a1a;
  --primary-dim: #e8e8e8;
  --success: #1f7a3a;
  --success-dim: #d4edda;
  --warn: #92500a;
  --warn-dim: #fdefd4;
  --danger: #991b1b;
  --danger-dim: #fde8e8;
  --purple: #4c1d95;
  --purple-dim: #ede9fe;
  --text: #111111;
  --text2: #444444;
  --text3: #888888;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:var(--sans); background:var(--bg); color:var(--text); font-size:14px; }

/* ─── LAYOUT ─── */
#app { display:flex; height:100vh; overflow:hidden; }
#sidebar {
  width:220px; min-width:220px; background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  transition:width .3s;
}
#main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#topbar {
  height:56px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 24px; gap:16px; flex-shrink:0;
}
#content { flex:1; overflow-y:auto; padding:24px; }

/* ─── SIDEBAR ─── */
.logo {
  padding:20px 16px 16px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border);
}
.logo-icon {
  width:36px; height:36px; background:#111111; border-radius:8px;
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.logo-text { font-size:13px; font-weight:700; color:var(--text); line-height:1.3; }
.logo-sub { font-size:10px; color:var(--text3); font-weight:400; }

.nav { flex:1; padding:12px 8px; display:flex; flex-direction:column; gap:2px; }
.nav-item {
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border-radius:var(--radius-sm); cursor:pointer; transition:all .15s;
  color:var(--text2); font-size:13px; font-weight:500; user-select:none;
}
.nav-item:hover { background:var(--surface2); color:var(--text); }
.nav-item.active { background:#e8e8e8; color:#111111; border-left:3px solid #111111; }
.nav-item .icon { font-size:16px; width:20px; text-align:center; }
.nav-badge {
  margin-left:auto; background:var(--danger); color:#fff;
  font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px;
  font-family:var(--mono);
}

.sidebar-footer { padding:12px 16px; border-top:1px solid var(--border); }
.version-tag { font-size:10px; color:var(--text3); font-family:var(--mono); }

/* ─── TOPBAR ─── */
.page-title { font-size:16px; font-weight:700; color:var(--text); flex:1; }
.topbar-actions { display:flex; gap:8px; align-items:center; }
.btn {
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px;
  border-radius:var(--radius-sm); font-size:13px; font-weight:600;
  cursor:pointer; border:none; font-family:var(--sans); transition:all .15s;
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#333333; }
.btn-ghost { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--surface3); color:var(--text); }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn-danger { background:var(--danger-dim); color:var(--danger); border:1px solid var(--danger); }
.btn-success { background:var(--success-dim); color:var(--success); }

/* ─── CARDS / GRID ─── */
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
}
.card-sm { padding:16px; }
.grid { display:grid; gap:16px; }
.grid-4 { grid-template-columns:repeat(4,1fr); }
.grid-3 { grid-template-columns:repeat(3,1fr); }
.grid-2 { grid-template-columns:repeat(2,1fr); }

/* ─── STAT CARDS ─── */
.stat-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px 20px;
  display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;
}
.stat-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
}
.stat-card.blue::before { background:var(--primary); }
.stat-card.green::before { background:var(--success); }
.stat-card.warn::before { background:var(--warn); }
.stat-card.danger::before { background:var(--danger); }
.stat-card.purple::before { background:var(--purple); }
.stat-label { font-size:11px; color:var(--text3); font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
.stat-value { font-size:32px; font-weight:700; font-family:var(--mono); color:var(--text); }
.stat-sub { font-size:11px; color:var(--text2); }

/* ─── TABLE ─── */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th {
  background:var(--surface2); color:var(--text3); font-size:11px;
  font-weight:600; letter-spacing:.5px; text-transform:uppercase;
  padding:10px 14px; text-align:left; border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td {
  padding:11px 14px; border-bottom:1px solid var(--border);
  font-size:13px; color:var(--text2); vertical-align:middle;
}
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--surface2); color:var(--text); }
td.bold { color:var(--text); font-weight:600; }

/* ─── BADGES ─── */
.badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:4px; font-size:11px; font-weight:600;
  white-space:nowrap; font-family:var(--mono);
}
.badge-blue { background:var(--primary-dim); color:var(--primary); }
.badge-green { background:var(--success-dim); color:var(--success); }
.badge-warn { background:var(--warn-dim); color:var(--warn); }
.badge-danger { background:var(--danger-dim); color:var(--danger); }
.badge-purple { background:var(--purple-dim); color:var(--purple); }
.badge-gray { background:var(--surface3); color:var(--text2); }

/* ─── FORM ─── */
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-label { font-size:12px; font-weight:600; color:var(--text2); }
.form-input, .form-select, .form-textarea {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:9px 12px; color:var(--text);
  font-size:13px; font-family:var(--sans); outline:none; transition:border .15s;
  width:100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color:var(--primary);
}
.form-select option { background:var(--surface2); }
.form-textarea { resize:vertical; min-height:80px; }
.form-grid { display:grid; gap:14px; }
.form-grid-2 { grid-template-columns:1fr 1fr; }
.form-grid-3 { grid-template-columns:1fr 1fr 1fr; }
.form-checkbox { display:flex; align-items:center; gap:8px; cursor:pointer; }
.form-checkbox input { width:16px; height:16px; accent-color:var(--primary); cursor:pointer; }

/* ─── MODAL ─── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7);
  display:flex; align-items:center; justify-content:center;
  z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;
}
.modal-overlay.show { opacity:1; pointer-events:all; }
.modal {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--radius); width:min(680px,95vw); max-height:90vh;
  overflow-y:auto; transform:translateY(-10px); transition:transform .2s;
}
.modal-overlay.show .modal { transform:translateY(0); }
.modal-header {
  padding:20px 24px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-title { font-size:16px; font-weight:700; }
.modal-close {
  background:none; border:none; color:var(--text3); font-size:20px;
  cursor:pointer; line-height:1; padding:4px;
}
.modal-close:hover { color:var(--text); }
.modal-body { padding:24px; display:flex; flex-direction:column; gap:16px; }
.modal-footer {
  padding:16px 24px; border-top:1px solid var(--border);
  display:flex; justify-content:flex-end; gap:8px;
}

/* ─── MISC ─── */
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.section-title { font-size:15px; font-weight:700; color:var(--text); }
.section-sub { font-size:12px; color:var(--text3); margin-top:2px; }
.divider { height:1px; background:var(--border); margin:16px 0; }
.empty { text-align:center; padding:40px 20px; color:var(--text3); font-size:13px; }
.tag { display:inline-flex; align-items:center; gap:3px; padding:2px 7px; background:var(--surface3); border-radius:4px; font-size:11px; color:var(--text2); }
.tag-new { background:var(--primary-dim); color:var(--primary); }
.search-bar {
  display:flex; align-items:center; gap:8px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:8px 12px; flex:1; max-width:320px;
}
.search-bar input { background:none; border:none; color:var(--text); font-size:13px; outline:none; flex:1; font-family:var(--sans); }
.filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.dday-ok { color:var(--success); font-family:var(--mono); font-weight:600; font-size:12px; }
.dday-warn { color:var(--warn); font-family:var(--mono); font-weight:600; font-size:12px; }
.dday-danger { color:var(--danger); font-family:var(--mono); font-weight:700; font-size:12px; }
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }
.dot-green { background:var(--success); }
.dot-warn { background:var(--warn); }
.dot-danger { background:var(--danger); }
.dot-gray { background:var(--text3); }
.renewal-tag { background:#e8f5e9; color:#1b5e20; border:1px solid #a5d6a7; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:700; }

/* scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* ─── BOTTOM TAB BAR (mobile only) ─── */
#bottom-nav {
  display:none;
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  background:var(--surface); border-top:2px solid var(--border2);
}
.bnav-inner { display:flex; height:62px; padding-bottom:env(safe-area-inset-bottom,0); }
.bnav-item {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; cursor:pointer; position:relative;
  color:var(--text3); transition:color .15s; padding:6px 2px;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.bnav-item.active { color:#111111; }
.bnav-item.active::after {
  content:''; position:absolute; top:0; left:20%; right:20%;
  height:2px; background:#111111; border-radius:0 0 3px 3px;
}
.bnav-item .bicon { font-size:20px; line-height:1.2; }
.bnav-item .blabel { font-size:9px; font-weight:600; white-space:nowrap; }
.bnav-item .bbadge {
  position:absolute; top:5px; right:calc(50% - 20px);
  background:var(--danger); color:#fff; font-size:9px; font-weight:700;
  padding:1px 4px; border-radius:8px;
}

@media(max-width:768px) {
  #sidebar { display:none !important; }
  #bottom-nav { display:block; }
  #content { padding:14px 12px 78px; }
  #topbar { padding:0 14px; height:50px; }
  .page-title { font-size:14px; }
  .btn { font-size:13px; padding:8px 11px; }
  .btn-sm { font-size:12px; padding:7px 9px; }
  .grid-4 { grid-template-columns:repeat(2,1fr); }
  .grid-3, .grid-2 { grid-template-columns:1fr; }
  .form-grid-2, .form-grid-3 { grid-template-columns:1fr; }
  .form-input, .form-select, .form-textarea { font-size:16px; padding:11px 12px; }
  td { font-size:12px; padding:9px 10px; }
  th { font-size:10px; padding:8px 10px; }
  .stat-value { font-size:26px; }
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.modal { width:100vw; max-height:93vh; border-radius:16px 16px 0 0; align-self:flex-end; display:flex; flex-direction:column; overflow:hidden; }
.modal-overlay { align-items:flex-end; }
.modal-header { padding:16px 18px; flex-shrink:0; }
.modal-body { padding:16px 18px; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.modal-footer { padding:16px 18px; flex-shrink:0; background:var(--surface); border-top:1px solid var(--border); }
</style>
</head>

<script>
/* ════════════════════════════════════
   DATA STORE  (Google Sheets 연동)
════════════════════════════════════ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSE9maHLIDFQFWUogxln6NLB-BN79KtN0dtKtm_bnVbUydQpiZq1iqPwO1HJRSfscc/exec';

const DB = {
  // 로컬 캐시 (오프라인 대비)
  _cache: {},

  get(k) {
    // 캐시 우선 반환 (빠른 렌더링)
    return this._cache[k] !== undefined ? this._cache[k] : 
           JSON.parse(localStorage.getItem('fm_'+k) || 'null');
  },

  set(k, v) {
    // 1) 로컬에도 저장 (오프라인 대비)
    localStorage.setItem('fm_'+k, JSON.stringify(v));
    this._cache[k] = v;

    // 2) 서버에 비동기 저장 (실패해도 로컬은 유지)
    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ key: k, value: v })
    }).catch(err => console.warn('서버 저장 실패 (로컬 저장됨):', err));
  },

  load(k, def) {
    const d = this.get(k);
    return d !== null ? d : def;
  },

  // 서버에서 최신 데이터 불러오기
  async sync(k) {
    try {
      const res = await fetch(`${SCRIPT_URL}?key=${k}`);
      const data = await res.json();
      if (data !== null) {
        this._cache[k] = data;
        localStorage.setItem('fm_'+k, JSON.stringify(data));
      }
      return data;
    } catch(e) {
      console.warn('동기화 실패, 로컬 데이터 사용:', e);
      return this.get(k);
    }
  }
};

// 앱 시작 시 서버에서 최신 데이터 동기화
async function syncAllFromServer() {
  const keys = ['equipment', 'history', 'consumable', 'legal', 'drawings'];
  await Promise.all(keys.map(k => DB.sync(k)));
  // 동기화 후 현재 탭 다시 렌더링
  if(typeof currentTab !== 'undefined' && currentTab) switchTab(currentTab);
}
// 초기 샘플 데이터
function initData() {
  if (DB.get('equipment') !== null) return;

      {id:'EQ002',name:'흄후드 FH-501',model:'FH-1200',maker:'스피드에어',location:'5층-B구역',risk:'고위험',substance:'유해화학물질',installed:'2026-03-20',renewal:true,status:'정상'},
      {id:'EQ003',name:'분전반 MCC-01',model:'MCC-100A',maker:'LS산전',location:'5층 전기실',risk:'일반',substance:'',installed:'2026-04-01',renewal:true,status:'정상'},
      {id:'EQ004',name:'냉각탑 CT-01',model:'CT-200T',maker:'덕양산업',location:'옥상',risk:'저위험',substance:'',installed:'2023-06-10',renewal:false,status:'정상'},
      {id:'EQ005',name:'소화기 FE-01',model:'ABC-3kg',maker:'파이어맨',location:'5층 복도',risk:'저위험',substance:'',installed:'2026-04-10',renewal:true,status:'정상'},
    ]);
    DB.set('history', [

/* ════════════════════════════════════
   UTILITY
════════════════════════════════════ */
let _idCounter = Date.now();
function uid() { return 'ID'+(++_idCounter); }

function today() { return new Date().toISOString().slice(0,10); }
function dday(dateStr) {
  const d = Math.ceil((new Date(dateStr)-new Date(today()))/(1000*60*60*24));
  return d;
}
function nextDate(base, days) {
  const d = new Date(base);
  d.setDate(d.getDate()+parseInt(days));
  return d.toISOString().slice(0,10);
}
function legalNext(type, lastDate) {
  const m = {'일상점검':1,'정기점검':180,'특별점검':null,'정밀안전진단':730};
  const days = m[type];
  if(!days) return null;
  return nextDate(lastDate, days);
}
function ddayBadge(d) {
  if(d===null) return '<span class="badge badge-gray">-</span>';
  if(d<0) return `<span class="dday-danger">D${d}</span>`;
  if(d<=7) return `<span class="dday-danger">D-${d}</span>`;
  if(d<=30) return `<span class="dday-warn">D-${d}</span>`;
  return `<span class="dday-ok">D-${d}</span>`;
}
function riskBadge(r) {
  if(r==='고위험') return '<span class="badge badge-danger">고위험</span>';
  if(r==='일반') return '<span class="badge badge-blue">일반</span>';
  return '<span class="badge badge-gray">저위험</span>';
}
function resultBadge(r) {
  const m = {'양호':'badge-green','일부결함':'badge-warn','개선필요':'badge-danger','사용제한':'badge-danger'};
  return `<span class="badge ${m[r]||'badge-gray'}">${r}</span>`;
}
function statusDot(s) {
  const m = {'정상':'dot-green','점검중':'dot-warn','고장':'dot-danger','사용중지':'dot-gray'};
  return `<span class="dot ${m[s]||'dot-gray'}"></span> ${s}`;
}

/* 뱃지 업데이트 */
function updateBadges() {
  const cons = getCons();
  const urgentCons = cons.filter(c => {
    const n = nextDate(c.lastDate, c.cycle);
    return dday(n) <= 7;
  }).length;
  ['badge-consumable','bnav-badge-consumable'].forEach(id => {
    const el = document.getElementById(id);
    if(el) { el.textContent=urgentCons; el.style.display=urgentCons>0?'':'none'; }
  });

  const legal = getLegal();
  const urgentLegal = legal.filter(l => {
    const n = legalNext(l.type, l.lastDate);
    return n && dday(n) <= 30;
  }).length;
  ['badge-legal','bnav-badge-legal'].forEach(id => {
    const el = document.getElementById(id);
    if(el) { el.textContent=urgentLegal; el.style.display=urgentLegal>0?'':'none'; }
  });
}

        <option value="">전체 유형</option>

        : drawings.map(d=>drawingCard(d)).join('')

function drawingCard(d) {
  const typeColor = {'평면도':'badge-blue','계통도':'badge-purple','소방도':'badge-danger','전기도':'badge-warn','기타':'badge-gray'};
  const preview = d.fileData && d.fileData.startsWith('data:image')
    ? `<div style="height:160px;background:var(--surface3);border-radius:6px;overflow:hidden;margin-bottom:14px;cursor:pointer" onclick="previewDrawing('${d.id}')">
        <img src="${d.fileData}" style="width:100%;height:100%;object-fit:contain;" alt="${d.title}">
       </div>`
    : d.fileData && d.fileData.startsWith('data:application/pdf')
    ? `<div style="height:160px;background:var(--surface3);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;cursor:pointer" onclick="previewDrawing('${d.id}')">
        <span style="font-size:40px">📄</span>
        <span style="font-size:12px;color:var(--text2)">${d.fileName||'PDF 파일'}</span>
        <span style="font-size:11px;color:var(--primary)">클릭하여 열기</span>
       </div>`
    : `<div style="height:160px;background:var(--surface3);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;${d.linkUrl?'cursor:pointer':''}" ${d.linkUrl?`onclick="window.open('${d.linkUrl}','_blank')"`:''}>
        <span style="font-size:36px">📐</span>
        ${d.linkUrl?'<span style="font-size:11px;color:var(--primary)">🔗 클릭하여 열기</span>':'<span style="font-size:11px;color:var(--text3)">파일 없음</span>'}
       </div>`;
  return `
    <div class="card card-sm" style="display:flex;flex-direction:column;">
      ${preview}
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;">
        <div class="bold" style="font-size:14px;color:var(--text);line-height:1.3">${d.title}</div>
        <span class="badge ${typeColor[d.type]||'badge-gray'}" style="flex-shrink:0">${d.type}</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
        <span class="tag">${d.floor}</span>
        <span class="tag">${d.area}</span>
      </div>
      ${d.note?`<div style="font-size:12px;color:var(--text3);margin-bottom:8px;line-height:1.5">${d.note}</div>`:''}
      <div style="font-size:11px;color:var(--text3);margin-bottom:12px;font-family:var(--mono)">수정: ${d.updated}</div>
      <div style="display:flex;gap:6px;margin-top:auto;">
        ${d.linkUrl?`<button class="btn btn-ghost btn-sm" style="flex:1" onclick="window.open('${d.linkUrl}','_blank')">🔗 링크 열기</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="openDrawingModal('${d.id}')">수정</button>
        <button class="btn btn-danger btn-sm" onclick="delDrawing('${d.id}')">삭제</button>
      </div>
    </div>
  `;
}

function previewDrawing(id) {
  const d = getDrawings().find(d=>d.id===id);
  if(!d) return;
  if(d.fileData && d.fileData.startsWith('data:application/pdf')) {
    const blob = dataURLtoBlob(d.fileData);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    return;
  }
  if(d.fileData && d.fileData.startsWith('data:image')) {
    document.getElementById('modal-title').textContent = d.title;
    document.getElementById('modal-body').innerHTML = `
      <img src="${d.fileData}" style="width:100%;border-radius:6px;" alt="${d.title}">
    `;
    document.getElementById('modal-footer').innerHTML = `
      <button class="btn btn-ghost" onclick="closeModal()">닫기</button>
    `;
    openModal();
  }
}

function dataURLtoBlob(dataURL) {
  const arr = dataURL.split(','), mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]); let n = bstr.length; const u8 = new Uint8Array(n);
  while(n--) u8[n] = bstr.charCodeAt(n);
  return new Blob([u8], {type:mime});
}

  if(!confirm('삭제하시겠습니까?')) return;
  DB.set('drawings', getDrawings().filter(d=>d.id!==id));
  renderDrawing();
}

        </select>
      </div>
      <div class="form-group">
        <label class="form-label">수정일</label>
        <input class="form-input" type="date" id="dw-updated" value="${d?.updated||today()}">
      </div>
    </div>

    <div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:12px;font-weight:600;color:var(--text2)">📎 파일 첨부 (둘 중 하나 또는 둘 다)</div>

      <div class="form-group">
        <label class="form-label">🔗 구글 드라이브 / 외부 링크 URL</label>
        <input class="form-input" id="dw-link" placeholder="https://drive.google.com/..." value="${d?.linkUrl||''}">
      </div>

      <div class="form-group">
        <label class="form-label">📁 파일 직접 업로드 (이미지 JPG·PNG 또는 PDF, 5MB 이하)</label>
        <input type="file" id="dw-file" accept="image/*,application/pdf" class="form-input" style="padding:6px;" onchange="previewUpload(this)">
        ${d?.fileName?`<div style="font-size:12px;color:var(--success);margin-top:4px">✓ 현재 파일: ${d.fileName}</div>`:''}
      </div>
      <div id="upload-preview" style="display:none">
        <img id="upload-img-preview" style="max-width:100%;max-height:200px;border-radius:6px;object-fit:contain;background:var(--surface3);display:none">
        <div id="upload-pdf-preview" style="display:none;padding:12px;background:var(--surface3);border-radius:6px;text-align:center;color:var(--text2);font-size:13px">📄 PDF 파일 선택됨</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">비고</label>
      <textarea class="form-textarea" id="dw-note" style="min-height:60px">${d?.note||''}</textarea>
    </div>
  `;
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">취소</button>
    <button class="btn btn-primary" onclick="saveDrawing('${id||''}')">저장</button>
  `;
  openModal();
}

function previewUpload(input) {
  const file = input.files[0];
  if(!file) return;
  const preview = document.getElementById('upload-preview');
  const imgPrev = document.getElementById('upload-img-preview');
  const pdfPrev = document.getElementById('upload-pdf-preview');
  preview.style.display = 'block';
  if(file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = e => { imgPrev.src=e.target.result; imgPrev.style.display='block'; pdfPrev.style.display='none'; };
    reader.readAsDataURL(file);
  } else {
    imgPrev.style.display='none';
    pdfPrev.style.display='block';
    pdfPrev.textContent = `📄 ${file.name}`;
  }
}

function saveDrawing(id) {
  const title = document.getElementById('dw-title').value.trim();
  const floor = document.getElementById('dw-floor').value.trim();
  if(!title||!floor) { alert('제목과 층/구역은 필수입니다.'); return; }

  const fileInput = document.getElementById('dw-file');
  const file = fileInput.files[0];
  const existing = id ? getDrawings().find(d=>d.id===id) : null;

  function doSave(fileData, fileName) {
    const data = {
      id: id||'DW'+String(Date.now()).slice(-6),
      title, floor, area: document.getElementById('dw-area').value.trim(),
      type: document.getElementById('dw-type').value,
      linkUrl: document.getElementById('dw-link').value.trim(),
      fileData: fileData, fileName: fileName,
      note: document.getElementById('dw-note').value.trim(),
      updated: document.getElementById('dw-updated').value
    };
    let drawings = getDrawings();
    if(id) drawings = drawings.map(d=>d.id===id?data:d);
    else drawings.push(data);
    try {
      DB.set('drawings', drawings);
    } catch(e) {
      alert('저장 용량 초과입니다. 파일 크기를 줄이거나 링크 방식을 사용해 주세요.');
      return;
    }
    closeModal(); renderDrawing();
  }

  if(file) {
    if(file.size > 5*1024*1024) { alert('파일 크기는 5MB 이하만 가능합니다.'); return; }
    const reader = new FileReader();
    reader.onload = e => doSave(e.target.result, file.name);
    reader.readAsDataURL(file);
  } else {
    doSave(existing?.fileData||null, existing?.fileName||null);
  }
}


function openModal() {
  document.getElementById('modal-overlay').classList.add('show');
  const bnav = document.getElementById('bottom-nav');
  if(bnav) bnav.style.setProperty('display', 'none', 'important');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  const bnav = document.getElementById('bottom-nav');
  if(bnav) bnav.style.removeProperty('display');
}
function closeModalOnBg(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }
